services:
  journalizer:
    build: .
    container_name: journalizer
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - /opt/journalizer/data/journals:/data/journals
      - /opt/journalizer/data:/appdata
      - /opt/journalizer/secrets/key.key:/run/secrets/journal.key:ro

    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application
             --bind 0.0.0.0:8000
             --workers 2"